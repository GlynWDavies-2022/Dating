<div class="card bg-base-100 mx-auto flex flex-col rounded-lg p-6 shadow-lg">
  <div class="card-title text-primary justify-center text-3xl">Sign up</div>
  <div class="card-body w-full">
    <form #registerForm="ngForm" class="flex w-full flex-col gap-4" (ngSubmit)="register()">
      <input type="text" class="input w-full" name="email" [(ngModel)]="credentials.email" placeholder="Email" />
      <input type="text" class="input w-full" name="displayName" [(ngModel)]="credentials.displayName" placeholder="Name" />
      <input type="password" class="input w-full" name="password" [(ngModel)]="credentials.password" placeholder="Password" />
      <select class="select w-full">
        <option disabled selected>Pick a member</option>
        @for (member of membersFromHome(); track $index)
        {
          <option value="{{member.id}}">{{member.displayName}}</option>
        }
      </select>
      <div class="flex items-center justify-end gap-3">
        <button class="btn">Cancel</button>
        <button class="btn btn-primary" type="submit">Register</button>
      </div>
    </form>
  </div>
</div>
