<app-nav />

<div class="card bg-base-100 mx-auto mt-24 w-1/2 p-10 shadow-xl">
  <h3 class="text-3xl font-bold">{{ title }}</h3>
  <ul class="list">
    @for(member of members(); track member.id)
    {
    <li class="list-row items-center">
      <img class="rounded-box size-12" src="/user.png" alt="user avatar" />
      <div>
        {{member.displayName}}
      </div>
    </li>
    }
  </ul>
</div>
